<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - NARSS HPC</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-card">
    <h2>👤 إنشاء حساب</h2>
    <p class="subtitle">إنشاء حساب جديد على NARSS HPC</p>

    <form id="registerForm">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="example@email.com">

        <label for="password">كلمة المرور</label>
        <input type="password" id="password" minlength="6" required placeholder="6 أحرف على الأقل">

        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" minlength="6" required>

        <button type="submit">إنشاء الحساب</button>
        <p id="message" class="message"></p>
    </form>

    <div class="auth-links">
        <a href="login.html">لديك حساب بالفعل؟ تسجيل الدخول</a>
        <a href="index.html">العودة للرئيسية</a>
    </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
