<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - NARSS HPC</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-card">

        <h2>🔑 تسجيل الدخول</h2>

        <p class="subtitle">
            الدخول إلى خدمات NARSS HPC
        </p>


        <form id="loginForm">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                required>


            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="********"
                required>


            <button type="submit">
                تسجيل الدخول
            </button>


            <p id="message" class="message"></p>

        </form>


        <div class="auth-links">

            <a href="register.html">
                ليس لديك حساب؟ أنشئ حساباً
            </a>

            <a href="index.html">
                العودة للرئيسية
            </a>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
