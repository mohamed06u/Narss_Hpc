<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NARSS HPC - Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Map CSS -->
    <link rel="stylesheet" href="../css/map.css">
    <script src="https://unpkg.com/shpjs@latest/shp.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>NARSS HPC</h2>
            <p>High Performance Computing</p>
        </div>

        <nav class="sidebar-nav">
            <a href="index.html" class="nav-btn">🏠 Home</a>
            <a href="map.html" class="nav-btn active">🗺️ Map</a>
            <a href="services/ondemand-computing.html" class="nav-btn">⚙️ On-Demand Computing</a>

            <!-- SHAPEFILE UPLOAD -->
            <div class="shapefile-box">
                <h3>📂 Shapefile</h3>
                <p>Upload a Shapefile ZIP</p>

                <input type="file" id="shapefileInput" accept=".zip">
                <button type="button" id="uploadShapefileBtn" class="upload-btn">Upload Shapefile</button>
                <p id="uploadStatus" class="upload-status"></p>
            </div>

            <!-- LOGOUT -->
            <button type="button" class="nav-btn logout" id="logoutBtn">🚪 Logout</button>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="topbar">
            <div>
                <h1 id="topbarTitle">Satellite Imagery</h1>
                <p>NARSS HPC Spatial Data</p>
            </div>
        </header>

        <!-- MAP SELECTOR TABS -->
        <div class="map-tabs-bar">
            <button class="map-tab-btn active" data-map="satellite">Satellite Map</button>
            <button class="map-tab-btn" data-map="geographic">Geographic Map</button>
            <button class="map-tab-btn" data-map="gis">GIS Analysis Map</button>
        </div>

        <section class="map-section">
            <!-- Map 1: Satellite Map -->
            <div class="map-pane active" id="pane-satellite">
                <div class="map-container" id="map-satellite"></div>
            </div>

            <!-- Map 2: Geographic / Street Map -->
            <div class="map-pane" id="pane-geographic">
                <div class="map-container" id="map-geographic"></div>
            </div>

            <!-- Map 3: GIS Analysis Map -->
            <div class="map-pane" id="pane-gis">
                <div class="map-container" id="map-gis"></div>
            </div>
        </section>
    </main>

    <!-- LEAFLET JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- AUTH JS -->
    <script src="../js/auth.js"></script>

    <!-- MAP JS -->
    <script src="../js/map.js"></script>

</body>

</html>
